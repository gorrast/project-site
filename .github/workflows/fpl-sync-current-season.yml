name: FPL current-season sync

on:
  schedule:
    # Daily at 07:00 UTC (offset an hour from the BlueBayCup update to avoid runner
    # contention). Also serves as the Supabase keep-alive ping regardless of matchday.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: fpl-sync-current-season
  # Never cancel a run that's already writing to the database.
  # A second trigger queues behind it instead.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version-file: '.python-version'
          enable-cache: true

      - name: Run current-season sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run pipeline/sync_current_season.py
