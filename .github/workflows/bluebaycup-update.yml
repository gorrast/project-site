name: BlueBayCup weekly update

on:
  schedule:
    # Daily at 06:17 UTC = 07:17 Swedish winter time (CET, UTC+1) or 08:17 Swedish summer time.
    # Off the top of the hour on purpose: GitHub's scheduler is overloaded at :00 and delays/drops those runs.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: bluebaycup-update
  # Never cancel a run that's already writing to the database. 
  # A second trigger queues behind it instead.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version-file: '.python-version'
          enable-cache: true

      - name: Run BlueBayCup update
        id: update
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run scripts/bluebaycup_update.py

      - name: Push notification on new gameweek
        if: steps.update.outputs.updated == 'true'
        run: curl -sf -d "BlueBayCup updated to gameweek ${{ steps.update.outputs.gameweek }}" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
