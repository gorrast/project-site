name: FPL historical backfill

on:
  workflow_dispatch: {}

concurrency:
  group: fpl-backfill-historical
  # Never cancel a run that's already writing to the database.
  # A second trigger queues behind it instead.
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version-file: '.python-version'
          enable-cache: true

      - name: Run historical backfill
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run pipeline/backfill_historical.py
